services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: restock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restock}
      POSTGRES_DB: restock
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restock -d restock"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - restock_pgdata:/var/lib/postgresql/data
      - ./docker/init/01-create-test-db.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro

volumes:
  restock_pgdata:
