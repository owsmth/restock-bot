name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: restock
          POSTGRES_PASSWORD: restock
          POSTGRES_DB: restock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restock -d restock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://restock:restock@localhost:5432/restock_test
      RESTOCK_TEST_DATABASE_URL: postgresql+psycopg://restock:restock@localhost:5432/restock_test
      REPORTER_HASH_SALT: ci-only-salt-at-least-sixteen-characters
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src tests scripts
      - run: alembic upgrade head
      - run: pytest
